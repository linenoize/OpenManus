# Docker Compose configuration for unified deployment

services:
  unified:
    build: 
      context: .
      dockerfile: docker/unified-all/Dockerfile
    ports:
      - "8080:80"  # Single exposed port through nginx
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - FLASK_APP=src/server.py
      - FLASK_ENV=development
      - FRONTEND_PORT=3000
      - API_PORT=5000
      - TOOLS_PORT=5001
      - API_HOST=localhost
      - API_PATH=api
    volumes:
      - ./src:/app/src
      - ./data:/app/data:rw
      - ./.env:/app/.env
      - ./config.json:/app/config.json
    # We're now running as root inside the container
    # user: "${UID:-1000}:${GID:-1000}"