worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Enable logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Use environment variables for port configuration
    env FRONTEND_PORT;
    env API_PORT;
    env TOOLS_PORT;
    
    # Frontend server
    upstream frontend {
        server localhost:${FRONTEND_PORT:-3000};
    }

    # Main API server
    upstream api {
        server localhost:${API_PORT:-5000};
    }

    # Tools server
    upstream tools {
        server localhost:${TOOLS_PORT:-5001};
    }

    server {
        listen 80;
        server_name _;
        
        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","message":"Nginx proxy is running"}';
        }
        
        # Frontend routes - proxy to Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Handle frontend proxy errors
            proxy_intercept_errors on;
            error_page 502 503 504 /error/frontend_unavailable.html;
        }

        # API routes
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Increase timeouts for longer API operations
            proxy_read_timeout 120s;
            
            # Handle API proxy errors
            proxy_intercept_errors on;
            error_page 502 503 504 /error/api_unavailable.html;
        }

        # Tools routes
        location /tools/ {
            rewrite ^/tools/(.*) /$1 break;
            proxy_pass http://tools;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Handle tools proxy errors
            proxy_intercept_errors on;
            error_page 502 503 504 /error/tools_unavailable.html;
        }
        
        # Error pages
        location /error/ {
            root /app/errors;
            internal;
        }
    }
}