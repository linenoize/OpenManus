<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Frontend Service Unavailable - OpenManus</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 650px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            color: #e74c3c;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            background: #3498db;
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            margin-top: 1rem;
        }
        .btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Frontend Service Unavailable</h1>
    <p>The OpenManus frontend service is currently not responding. This may be due to maintenance or a temporary issue.</p>
    <p>Our system will automatically try to reconnect to the service.</p>
    <a href="/" class="btn">Retry</a>
    <p><small>If this issue persists, please contact your system administrator.</small></p>
</body>
</html>
